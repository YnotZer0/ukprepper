<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<style>@import url(common.css);</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs>
<rect width="1200" height="900" fill="#fff"/>
<text x="40" y="50" class="t">5. Maintenance cycle and routine</text>
<!-- cycle boxes -->
<rect x="60" y="100" width="320" height="150" rx="16" fill="#d9c7a3" stroke="#111" stroke-width="3"/>
<text x="220" y="145" class="l" text-anchor="middle">1. Fill pit A</text>
<text x="220" y="180" class="s" text-anchor="middle">cover every deposit;</text>
<text x="220" y="204" class="s" text-anchor="middle">level the peak weekly</text>
<rect x="440" y="100" width="320" height="150" rx="16" fill="#eee" stroke="#111" stroke-width="3"/>
<text x="600" y="145" class="l" text-anchor="middle">2. Switch</text>
<text x="600" y="180" class="s" text-anchor="middle">when A is 3/4 full: deep cover,</text>
<text x="600" y="204" class="s" text-anchor="middle">screw A's lid shut, open B</text>
<rect x="820" y="100" width="320" height="150" rx="16" fill="#cfd8c4" stroke="#111" stroke-width="3"/>
<text x="980" y="145" class="l" text-anchor="middle">3. A rests</text>
<text x="980" y="180" class="s" text-anchor="middle">at least 12 months</text>
<text x="980" y="204" class="s" text-anchor="middle">untouched while B fills</text>
<rect x="440" y="320" width="320" height="150" rx="16" fill="#5d4a33" stroke="#111" stroke-width="3"/>
<text x="600" y="365" class="l" text-anchor="middle" fill="#fff">4. Empty A</text>
<text x="600" y="400" class="s" text-anchor="middle" fill="#fff">lift panel, dig out from above;</text>
<text x="600" y="424" class="s" text-anchor="middle" fill="#fff">away from nuts &amp; food</text>
<path d="M380,175 L436,175" class="ln" marker-end="url(#a)"/>
<path d="M760,175 L816,175" class="ln" marker-end="url(#a)"/>
<path d="M980,250 C980,330 860,395 764,395" class="ln" marker-end="url(#a)"/>
<path d="M440,395 C300,395 220,330 220,254" class="ln" marker-end="url(#a)"/>
<text x="60" y="440" class="s">relay a straw bed,</text><text x="60" y="464" class="s">then reuse A</text>
<!-- routine table -->
<rect x="60" y="520" width="1080" height="340" fill="#fafafa" stroke="#111" stroke-width="2"/>
<text x="90" y="565" class="l" font-weight="bold">Every visit</text>
<text x="330" y="565" class="s">cover deposit fully · lid down · wash hands with soap and water</text>
<text x="90" y="625" class="l" font-weight="bold">Daily</text>
<text x="330" y="625" class="s">wipe seat + diverter (vinegar spray) · top up cover bin, hand-wash water, soap</text>
<text x="90" y="685" class="l" font-weight="bold">Weekly</text>
<text x="330" y="685" class="s">rake heap level · check tank overflow runs freely · flush pipe with</text>
<text x="330" y="709" class="s">warm water + vinegar · check fly mesh and panels</text>
<text x="90" y="769" class="l" font-weight="bold">Monthly</text>
<text x="330" y="769" class="s">descale diverter, pipe and tank (citric acid / vinegar) · top up trench chip</text>
<text x="330" y="793" class="s">· check the soil bank round the collar · roof after storms</text>
<text x="90" y="843" class="s" fill="#a00">NEVER mix bleach with urine - it releases toxic chloramine gas.</text>
</svg>
